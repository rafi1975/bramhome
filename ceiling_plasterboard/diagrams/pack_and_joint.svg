<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Ceiling packer and seam biscuit">
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #1a1a1a; }
    .muted { fill: #5c5c5c; font-size: 12px; }
    .title { font-size: 16px; font-weight: 700; }
    .label { font-size: 13px; }
  </style>
  <rect width="920" height="420" fill="#f7f5f0"/>

  <text x="24" y="32" class="title">1. 4 mm packer on a joist</text>
  <!-- joist -->
  <rect x="40" y="50" width="360" height="70" fill="#d2b48c" stroke="#7a5c32"/>
  <text x="160" y="90" class="label">joist soffit</text>
  <!-- packer -->
  <rect x="40" y="120" width="200" height="16" fill="#3d7ea6" stroke="#24516d"/>
  <text x="90" y="133" class="label" fill="#fff">4 mm packer</text>
  <!-- new board -->
  <rect x="40" y="136" width="200" height="36" fill="#f3ead2" stroke="#8a7a50"/>
  <text x="85" y="160" class="label">13 mm new board</text>
  <!-- old board -->
  <rect x="240" y="120" width="160" height="52" fill="#e6d7b0" stroke="#8a7a50"/>
  <text x="268" y="150" class="label">17 mm existing</text>
  <!-- room face -->
  <line x1="40" y1="188" x2="400" y2="188" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="40" y="208" class="muted">room face  flush</text>

  <text x="470" y="32" class="title">2. Seam biscuit at the cut</text>
  <!-- old board -->
  <rect x="500" y="86" width="140" height="68" fill="#e6d7b0" stroke="#8a7a50"/>
  <text x="525" y="124" class="label">17 mm old</text>
  <!-- new board -->
  <rect x="656" y="102" width="140" height="52" fill="#f3ead2" stroke="#8a7a50"/>
  <text x="680" y="132" class="label">13 mm new</text>
  <!-- biscuit: old flange, web, new flange -->
  <rect x="560" y="70" width="80" height="16" fill="#3d7ea6" stroke="#24516d"/>
  <rect x="640" y="70" width="8" height="78" fill="#2c5f7c" stroke="#24516d"/>
  <rect x="648" y="70" width="80" height="32" fill="#3d7ea6" stroke="#24516d"/>
  <text x="560" y="62" class="muted">biscuit (hidden in cavity)</text>
  <line x1="500" y1="154" x2="796" y2="154" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="500" y="176" class="muted">leave ~2 mm taping gap around the web</text>

  <text x="24" y="250" class="title">3. Uneven soffits  stack shims to a laser line</text>
  <rect x="40" y="270" width="70" height="90" fill="#d2b48c" stroke="#7a5c32"/>
  <rect x="40" y="360" width="70" height="16" fill="#3d7ea6" stroke="#24516d"/>
  <text x="48" y="304" class="muted">lowest</text>
  <text x="52" y="372" class="muted" fill="#fff">4 mm</text>

  <rect x="160" y="270" width="70" height="70" fill="#d2b48c" stroke="#7a5c32"/>
  <rect x="160" y="340" width="70" height="20" fill="#6aa84f" stroke="#3d6b2e"/>
  <rect x="160" y="360" width="70" height="16" fill="#3d7ea6" stroke="#24516d"/>
  <text x="168" y="304" class="muted">+5 mm</text>
  <text x="172" y="354" class="muted" fill="#fff">5</text>
  <text x="172" y="372" class="muted" fill="#fff">4</text>

  <rect x="280" y="270" width="70" height="50" fill="#d2b48c" stroke="#7a5c32"/>
  <rect x="280" y="320" width="70" height="40" fill="#6aa84f" stroke="#3d6b2e"/>
  <rect x="280" y="360" width="70" height="16" fill="#3d7ea6" stroke="#24516d"/>
  <text x="288" y="300" class="muted">+10 mm</text>
  <text x="292" y="344" class="muted" fill="#fff">10</text>
  <text x="292" y="372" class="muted" fill="#fff">4</text>

  <line x1="40" y1="376" x2="400" y2="376" stroke="#c0392b" stroke-width="2"/>
  <text x="410" y="372" class="label">laser / existing ceiling plane</text>
  <rect x="40" y="376" width="310" height="28" fill="#f3ead2" stroke="#8a7a50"/>
  <text x="120" y="394" class="label">13 mm plasterboard</text>
</svg>
